apiVersion: v1
kind: ServiceAccount
metadata:
  name: scs-backend
  namespace: scs
  labels:
    app.kubernetes.io/name: scs-backend
    app.kubernetes.io/part-of: supplychain-sentinel
    app.kubernetes.io/managed-by: kubectl
  # No IRSA annotation. Credentials are delivered by EKS Pod Identity,
  # which is configured on the AWS side via the
  # aws_eks_pod_identity_association Terraform resource in pod-identity.tf.
  # The IAM role (scs-dev-backend-secrets-role) is bound to this exact
  # namespace and service account name in the association — no annotation
  # is required or expected on the ServiceAccount itself.
automountServiceAccountToken: false
