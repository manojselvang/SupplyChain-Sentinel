apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: scs-backend-secrets
  namespace: scs
  labels:
    app.kubernetes.io/name: scs-backend
    app.kubernetes.io/part-of: supplychain-sentinel
spec:
  provider: aws
  parameters:
    region: ap-south-1
    usePodIdentity: "true"
    objects: |
      - objectName: "scs-dev/db/app"
        objectType: "secretsmanager"
        jmesPath:
          - path: host
            objectAlias: DB_HOST
          - path: dbname
            objectAlias: DB_NAME
          - path: username
            objectAlias: DB_USERNAME
          - path: password
            objectAlias: DB_PASSWORD

      - objectName: "scs-dev/db/migrator"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: DB_MIGRATOR_USERNAME
          - path: password
            objectAlias: DB_MIGRATOR_PASSWORD

      - objectName: "scs-dev/app/runtime"
        objectType: "secretsmanager"
        jmesPath:
          - path: JWT_SECRET
            objectAlias: JWT_SECRET
          - path: CI_INGESTION_API_KEY
            objectAlias: CI_INGESTION_API_KEY
