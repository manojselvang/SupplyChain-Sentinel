spring:
  application:
    name: supplychain-sentinel
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: SupplyChain Sentinel
    description: Software Supply Chain Risk and Release Assurance Platform
    version: 0.1.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# CORS - comma-separated list of allowed frontend origins
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:supplychain-sentinel}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
    cookie-secure: ${APP_COOKIE_SECURE:false}
    max-login-attempts: ${APP_MAX_LOGIN_ATTEMPTS:5}
    lockout-duration-minutes: ${APP_LOCKOUT_DURATION_MINUTES:15}
  admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    email: ${INITIAL_ADMIN_EMAIL:}
