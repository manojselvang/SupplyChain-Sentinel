# Production profile - all values from environment variables.
# Designed for AWS EKS deployment with RDS PostgreSQL.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

# CORS origins from env var (e.g., CloudFront distribution domain)
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://localhost}
  jwt:
    # JWT_SECRET MUST be provided in production — no default.
    secret: ${JWT_SECRET}
    cookie-secure: ${APP_COOKIE_SECURE:true}
  admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    email: ${INITIAL_ADMIN_EMAIL:}

logging:
  level:
    com.supplychainsentinel: INFO
    org.flywaydb: INFO
